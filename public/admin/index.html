<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>BDS অ্যাডমিন প্যানেল</title>
  <link rel="icon" href="/brand/mark.png" />
  <style>
    :root { --bds-navy: #1e3a8a; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Hind Siliguri", system-ui, sans-serif; }
    #bds-hint {
      background: var(--bds-navy); color: #fff; padding: 10px 16px;
      font-size: 14px; line-height: 1.7;
    }
    #bds-hint a { color: #e8c766; }
  </style>
</head>
<body>
  <div id="bds-hint">
    <strong>BDS অ্যাডমিন প্যানেল</strong> — সেভ চাপলে পরিবর্তন GitHub-এ জমা হয় এবং ১–২ মিনিটের মধ্যে ওয়েবসাইটে লাইভ হয়ে যায়।
  </div>

  <script>
    (function () {
      // আলাদা পাসওয়ার্ড নেই: GitHub লগইনই একমাত্র ঢোকার পথ।
      // রিপোতে লেখার অনুমতি (collaborator) যাদের আছে, শুধু তারাই সেভ করতে পারবে।
      try { localStorage.removeItem('bds-admin-unlocked'); } catch (e) {}

      var s = document.createElement('script');
      s.src = '/admin/sveltia-cms.js';
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
