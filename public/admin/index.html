<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>BDS অ্যাডমিন প্যানেল</title>
  <link rel="icon" href="/brand/mark.png" />
  <style>
    :root { --bds-navy: #1e3a8a; --bds-gold: #c9a227; --bds-ivory: #faf8f4; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Hind Siliguri", system-ui, sans-serif; }

    #bds-hint {
      background: var(--bds-navy); color: #fff; padding: 10px 16px;
      font-size: 14px; line-height: 1.7;
    }
    #bds-hint a { color: #e8c766; }

    /* ─── পাসওয়ার্ড লক ─── */
    #bds-lock {
      position: fixed; inset: 0; z-index: 99999;
      display: flex; align-items: center; justify-content: center; padding: 20px;
      background:
        radial-gradient(circle at 20% 15%, rgba(30,58,138,0.10), transparent 40%),
        radial-gradient(circle at 85% 90%, rgba(201,162,39,0.12), transparent 42%),
        var(--bds-ivory);
    }
    #bds-lock-card {
      width: 100%; max-width: 380px; background: #fff;
      border: 1px solid #e7e2d6; border-radius: 18px; padding: 34px 28px;
      box-shadow: 0 24px 60px rgba(11,18,32,0.14); text-align: center;
    }
    #bds-lock-card img { width: 62px; height: 62px; object-fit: contain; }
    #bds-lock-card h1 { margin: 14px 0 4px; font-size: 20px; color: var(--bds-navy); }
    #bds-lock-card p.sub { margin: 0 0 22px; font-size: 13.5px; color: #6b6559; line-height: 1.6; }
    #bds-pass {
      width: 100%; padding: 12px 14px; font-size: 15px;
      border: 1px solid #d7d0c2; border-radius: 11px; outline: none; background: #fcfbf8;
    }
    #bds-pass:focus { border-color: var(--bds-navy); box-shadow: 0 0 0 3px rgba(30,58,138,0.14); }
    #bds-lock button {
      width: 100%; margin-top: 12px; padding: 12px 14px; font-size: 15px; font-weight: 700;
      color: #fff; background: var(--bds-navy); border: 0; border-radius: 11px; cursor: pointer;
      transition: filter .15s;
    }
    #bds-lock button:hover { filter: brightness(1.08); }
    #bds-err { margin: 12px 0 0; font-size: 13px; color: #a4133c; min-height: 18px; }
    #bds-note { margin: 18px 0 0; font-size: 11.5px; color: #8a8474; line-height: 1.6; }
  </style>
</head>
<body>
  <div id="bds-hint">
    <strong>BDS অ্যাডমিন প্যানেল</strong> — সেভ চাপলে পরিবর্তন GitHub-এ জমা হয় এবং ১–২ মিনিটের মধ্যে ওয়েবসাইটে লাইভ হয়ে যায়।
  </div>

  <!-- পাসওয়ার্ড লক স্ক্রিন -->
  <div id="bds-lock">
    <form id="bds-lock-card" autocomplete="off">
      <img src="/brand/mark.png" alt="BDS" />
      <h1>অ্যাডমিন প্যানেল</h1>
      <p class="sub">চালিয়ে যেতে পাসওয়ার্ড দাও</p>
      <input id="bds-pass" type="password" placeholder="পাসওয়ার্ড" autofocus autocomplete="current-password" />
      <button type="submit">প্রবেশ করো</button>
      <p id="bds-err"></p>
      <p id="bds-note">সঠিক পাসওয়ার্ড দেওয়ার পর GitHub লগইন করে যেকোনো তথ্য বদলাতে পারবে।</p>
    </form>
  </div>

  <script>
    (function () {
      // পাসওয়ার্ডের হ্যাশ — আসল পাসওয়ার্ড কোডে লেখা নেই
      var SALT = 'bds-admin::';
      var HASH = '898ec454bbc7f490e1f4ed95a9b5aefb6fed12df7955c1f361f7f9aa8cd19cbe';
      var KEY = 'bds-admin-unlocked';

      function sha256(str) {
        var buf = new TextEncoder().encode(str);
        return crypto.subtle.digest('SHA-256', buf).then(function (d) {
          return Array.prototype.map.call(new Uint8Array(d), function (b) {
            return b.toString(16).padStart(2, '0');
          }).join('');
        });
      }

      function loadCMS() {
        var s = document.createElement('script');
        // আধুনিক Sveltia CMS (একই কনফিগ ও লগইন); দরকারে ?classic দিলে পুরনো Decap এডিটর
        var classic = new URLSearchParams(location.search).has('classic');
        s.src = classic
          ? 'https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js'
          : '/admin/sveltia-cms.js';
        document.body.appendChild(s);
      }

      function unlock() {
        var lock = document.getElementById('bds-lock');
        if (lock) lock.remove();
        loadCMS();
      }

      // আগে আনলক করা থাকলে সরাসরি ঢুকবে
      var already = false;
      try { already = localStorage.getItem(KEY) === HASH; } catch (e) {}
      if (already) { unlock(); return; }

      var form = document.getElementById('bds-lock-card');
      var input = document.getElementById('bds-pass');
      var err = document.getElementById('bds-err');

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        err.textContent = '';
        sha256(SALT + input.value).then(function (h) {
          if (h === HASH) {
            try { localStorage.setItem(KEY, HASH); } catch (e) {}
            unlock();
          } else {
            err.textContent = 'পাসওয়ার্ড ঠিক হয়নি, আবার চেষ্টা করো।';
            input.value = '';
            input.focus();
          }
        });
      });
    })();
  </script>
</body>
</html>
